# Konfiguracja skanu sekretów (Gitleaks, CI). Wczytywana automatycznie z katalogu repo.
title = "TEAMKAPA gitleaks config"

[extend]
# Wszystkie domyślne reguły pozostają aktywne.
useDefault = true

[allowlist]
description = "Fałszywe alarmy: tag obrazu Valkey (słowo 'valkey' zawiera 'key', wersja wygląda na sekret)"
regexTarget = "line"
regexes = [
  '''valkey/valkey:[0-9]+\.[0-9]+\.[0-9]+-alpine[0-9.]*''',
]
