[project]
name = "teamkapa-coi-forms"
version = "0.1.0"
description = "COI Cyfryzacja formularzy — generowanie konfiguracji e-formularza z blankietu urzędowego"
requires-python = ">=3.14"
license = "MIT"

# Zależności runtime są przypięte w backend/*/requirements.txt (osobno dla każdego obrazu),
# narzędzia deweloperskie w requirements-dev.txt.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = [
    "RUF001", # polskie znaki/typografia w stringach są zamierzone
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
# Kod aplikacji i skrypty ewaluacji (eval/ nie jest pakietem — sprawdzany jako pliki).
files = ["backend", "eval"]

[[tool.mypy.overrides]]
module = [
    "arq.*",
    "asyncpg.*",
    "cv2",
    "cv2.*",
    "docling",
    "docling.*",
    "docling_core.*",
    "magic.*",
    "msgpack.*",
    "odfdo",
    "odfdo.*",
    "olefile",
    "olefile.*",
    "pypdfium2",
    "pypdfium2.*",
    "pytesseract",
    "pytesseract.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # arq wewnętrznie woła przestarzałe redis.close() przy zamykaniu workera
    "ignore:Call to deprecated close:DeprecationWarning",
]
