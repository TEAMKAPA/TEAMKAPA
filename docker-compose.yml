# COI Cyfryzacja formularzy — środowisko uruchomieniowe.
#
#   docker compose up -d --build                    # api, worker, postgres, valkey (+ migrate)
#   docker compose --profile gpu up -d --build      # + llm i vlm (vLLM, wymaga GPU NVIDIA)
#   docker compose --profile frontend up -d --build # + frontend
#
# Na zewnątrz wystawione są tylko porty API i frontendu. Sekrety pochodzą z .env w runtime.

name: teamkapa

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

x-vllm: &vllm
  build:
    context: docker/vllm
  image: teamkapa/vllm:v0.19.1
  profiles: [gpu]
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  ipc: host # współdzielona pamięć dla PyTorch (zalecenie vLLM)
  volumes:
    - model-cache:/models
  networks: [internal, egress]
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Jednorazowo stosuje migracje schematu (db/migrations) przed startem api i workera.
  migrate:
    <<: [*hardening, *app-env]
    image: teamkapa/api:0.4.0
    command: ["python", "-m", "backend.shared.db.migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  api:
    <<: [*hardening, *app-env]
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    image: teamkapa/api:0.4.0
    ports:
      - "${API_PORT:-8000}:8000"
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-512m},mode=1777
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [internal, edge]

  worker:
    <<: [*hardening, *app-env]
    build:
      context: .
      dockerfile: backend/worker/Dockerfile
    image: teamkapa/worker:0.4.0
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-512m},mode=1777
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    # Tylko sieć wewnętrzna: worker fizycznie nie ma dostępu do internetu
    # (gwarancja zakazu zewnętrznych API/SaaS).
    networks: [internal]

  postgres:
    <<: *hardening
    image: pgvector/pgvector:0.8.7-pg18-trixie
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:?ustaw POSTGRES_DB w .env}
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18: dane w podkatalogu wersji
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  valkey:
    <<: *hardening
    image: valkey/valkey:9.0.8-alpine3.24
    user: valkey
    # Kolejka zadań bez trwałości na dysku: pliki i wyniki nie są utrwalane w Valkey.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  llm:
    <<: *vllm
    command:
      - --model=${LLM_MODEL:-}
      - --served-model-name=${LLM_MODEL:-}
      - --port=8000
      - --gpu-memory-utilization=${LLM_GPU_MEMORY_UTILIZATION:-0.45}
      - --max-model-len=${LLM_MAX_MODEL_LEN:-16384}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}

  vlm:
    <<: *vllm
    command:
      - --model=${VLM_MODEL:-}
      - --served-model-name=${VLM_MODEL:-}
      - --port=8001
      - --gpu-memory-utilization=${VLM_GPU_MEMORY_UTILIZATION:-0.45}
      - --max-model-len=${VLM_MAX_MODEL_LEN:-16384}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}

  frontend:
    <<: *hardening
    build:
      context: frontend
    image: teamkapa/frontend:0.1.0
    profiles: [frontend]
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    tmpfs:
      - /tmp
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

networks:
  internal:
    internal: true # brak wyjścia do internetu
  edge: {} # porty publikowane na hosta (api, frontend)
  egress: {} # tylko llm/vlm: jednorazowe pobranie wag z Hugging Face

volumes:
  pgdata:
  model-cache:
