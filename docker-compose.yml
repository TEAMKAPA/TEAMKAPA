# COI Cyfryzacja formularzy — środowisko uruchomieniowe.
#
#   docker compose up -d --build                    # api, worker, postgres, valkey, llm-gateway
#   docker compose --profile frontend up -d --build # + frontend
#
# Na zewnątrz wystawione są tylko porty API i frontendu. Sekrety pochodzą z .env w runtime.
# Modele językowe: Eden AI (otwarte modele przez API) — jedynym wyjściem do internetu
# jest bramka llm-gateway, która zna klucz EDENAI_API_KEY.

name: teamkapa

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    # Worker i API nie znają klucza i nie łączą się z internetem — do modelu idą przez bramkę
    # (wartości z .env są nadpisywane: bezpośredni adres Eden AI nie ominie bramki).
    EDENAI_API_KEY: ""
    EDENAI_BASE_URL: http://llm-gateway:8080/v3

services:
  # Jednorazowo stosuje migracje schematu (db/migrations) przed startem api i workera.
  migrate:
    <<: [*hardening, *app-env]
    image: teamkapa/api:0.4.0
    command: ["python", "-m", "backend.shared.db.migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  api:
    <<: [*hardening, *app-env]
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    image: teamkapa/api:0.4.0
    ports:
      - "${API_PORT:-8000}:8000"
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-512m},mode=1777
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [internal, edge]

  worker:
    <<: [*hardening, *app-env]
    build:
      context: .
      dockerfile: backend/worker/Dockerfile
    image: teamkapa/worker:0.4.0
    tmpfs:
      - /tmp:size=${TMPFS_SIZE:-512m},mode=1777
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      llm-gateway: { condition: service_started }
    # Tylko sieć wewnętrzna: worker nie ma internetu ani klucza API — do modelu łączy się
    # wyłącznie przez llm-gateway (gwarancja, że dane nie trafią nigdzie poza Eden AI).
    networks: [internal]

  postgres:
    <<: *hardening
    image: pgvector/pgvector:0.8.7-pg18-trixie
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:?ustaw POSTGRES_DB w .env}
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18: dane w podkatalogu wersji
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  valkey:
    <<: *hardening
    image: valkey/valkey:9.0.8-alpine3.24
    user: valkey
    # Kolejka zadań bez trwałości na dysku: pliki i wyniki nie są utrwalane w Valkey.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Jedyne wyjście do internetu: przepuszcza wyłącznie zapytania do api.edenai.run (patrz
  # docker/llm-gateway/default.conf.template) i dokłada klucz API.
  llm-gateway:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24
    environment:
      EDENAI_API_KEY: ${EDENAI_API_KEY:-}
      NGINX_ENVSUBST_FILTER: EDENAI_
    volumes:
      - ./docker/llm-gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /tmp
      # konfiguracja z kluczem powstaje w pamięci (nie w obrazie); właściciel: nginx (UID 101)
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal, egress]

  frontend:
    <<: *hardening
    build:
      context: frontend
    image: teamkapa/frontend:0.2.0
    profiles: [frontend]
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    tmpfs:
      - /tmp
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

networks:
  internal:
    internal: true # brak wyjścia do internetu
  edge: {} # porty publikowane na hosta (api, frontend)
  egress: {} # tylko llm-gateway: zapytania do api.edenai.run

volumes:
  pgdata:
