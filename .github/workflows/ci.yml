name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks scan
        run: gitleaks detect --source . --redact --verbose

  lint:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.0.8-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: coi
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: coi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coi -d coi_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # W CI testy z libmagic, Valkey i PostgreSQL są wymagane, a nie pomijane.
      REQUIRE_LIBMAGIC: "1"
      VALKEY_TEST_URL: redis://localhost:6379/15
      POSTGRES_TEST_URL: postgresql://coi:test-only-password@localhost:5432/coi_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/api/requirements.txt
            backend/worker/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy

      - name: Run tests
        run: pytest

  docker:
    name: Docker build & hardening checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile gpu --profile frontend config --quiet

      - name: Build API and worker images
        run: docker compose build api worker

      - name: Images run as non-root user
        run: |
          for image in teamkapa/api:0.3.0 teamkapa/worker:0.3.0; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            echo "$image runs as UID $uid"
            if [ "$uid" = "0" ]; then echo "::error::$image runs as root"; exit 1; fi
          done

      - name: Images contain no secrets or .env
        run: |
          for image in teamkapa/api:0.3.0 teamkapa/worker:0.3.0; do
            if docker run --rm --entrypoint sh "$image" -c 'find / -xdev -name ".env" 2>/dev/null | grep -q .'; then
              echo "::error::$image contains a .env file"; exit 1
            fi
          done

  license-check:
    name: License Compliance (pip-licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python dependency licenses
        shell: bash
        run: |
          set -euo pipefail

          REQ_FILES=()
          for req in backend/api/requirements.txt backend/worker/requirements.txt; do
            if [ -f "$req" ] && grep -qE '^[[:space:]]*[^#[:space:]]' "$req"; then
              REQ_FILES+=("$req")
            fi
          done

          if [ "${#REQ_FILES[@]}" -eq 0 ]; then
            echo "All requirements.txt files are empty — skipping license check."
            exit 0
          fi

          python -m pip install --upgrade pip pip-licenses

          python -m venv /tmp/license-audit-venv
          /tmp/license-audit-venv/bin/python -m pip install --upgrade pip
          for req in "${REQ_FILES[@]}"; do
            echo "Installing dependencies from $req..."
            /tmp/license-audit-venv/bin/pip install -r "$req"
          done

          pip-licenses \
            --python=/tmp/license-audit-venv/bin/python \
            --from=mixed \
            --ignore-packages pip setuptools wheel \
            --format=markdown

          pip-licenses \
            --python=/tmp/license-audit-venv/bin/python \
            --from=mixed \
            --ignore-packages pip setuptools wheel \
            --format=json \
            --output-file=/tmp/licenses.json

          python - <<'PY'
          import json
          import re
          import sys

          FORBIDDEN_RE = re.compile(r"(agpl|lgpl|gpl)", re.IGNORECASE)

          with open("/tmp/licenses.json", encoding="utf-8") as fh:
              packages = json.load(fh)

          violations = [
              pkg for pkg in packages
              if FORBIDDEN_RE.search(pkg.get("License", "") or "")
          ]

          if violations:
              print("::error::Forbidden copyleft licenses (GPL/AGPL/LGPL) detected:")
              for pkg in violations:
                  print(f" - {pkg['Name']}=={pkg['Version']}: {pkg['License']}")
              sys.exit(1)

          print("License check passed: no GPL/AGPL/LGPL dependencies detected.")
          PY
